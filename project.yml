name: Repertory
packages:
  Alamofire:
    url: https://github.com/seanmarcusross-hue/Alamofire
    revision: 9799237b84cbd97f80a3ac9b69b30ba65139f752
options:
  bundleIdPrefix: com.repertory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Repertory:
    type: application
    platform: iOS
    sources:
      - path: Repertory
    resources:
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - package: Alamofire
      - sdk: GameKit.framework
    entitlements:
      path: Repertory/Repertory.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repertory.marquee
        PRODUCT_NAME: Repertory
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Sloglide
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  RepertoryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RepertoryTests
    dependencies:
      - target: Repertory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repertory.marquee.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Repertory.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Repertory"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Repertory:
    build:
      targets:
        Repertory: all
        RepertoryTests: [test]
    test:
      targets:
        - RepertoryTests
